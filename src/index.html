<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SprintLine — Projects & tasks</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SprintLine — lightweight project management for teams. Projects, kanban tasks, comments, and files."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />

    <!-- Prevent flash of wrong theme before Angular boots -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('sprintline-theme');
          var dark =
            mode === 'dark' ||
            ((mode === 'system' || !mode) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <!-- Plus Jakarta Sans — modern geometric sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <sl-root></sl-root>
  </body>
</html>
