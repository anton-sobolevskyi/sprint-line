<div class="bg-background flex min-h-svh flex-col">
  <header class="border-border bg-card/80 sticky top-0 z-40 border-b backdrop-blur-md">
    <div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-4 px-4">
      <div class="flex items-center gap-6">
        <a
          routerLink="/"
          class="text-foreground flex items-center gap-2.5 text-sm font-semibold tracking-tight"
        >
          <!-- Brand mark -->
          <span
            class="bg-primary text-primary-foreground flex size-7 items-center justify-center rounded-lg shadow-sm"
            aria-hidden="true"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              class="size-4"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12.5L9.5 17L19 7" />
              <path d="M5 8h14" opacity="0.55" />
            </svg>
          </span>
          <span>{{ messages.brand }}</span>
        </a>

        <nav class="hidden items-center gap-1 sm:flex" [attr.aria-label]="messages.navLabel">
          <a
            hlmBtn
            variant="ghost"
            size="sm"
            routerLink="/"
            routerLinkActive="bg-muted text-foreground"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ messages.nav.home }}
          </a>
          <a
            hlmBtn
            variant="ghost"
            size="sm"
            routerLink="/projects"
            routerLinkActive="bg-muted text-foreground"
          >
            {{ messages.nav.projects }}
          </a>
          <a
            hlmBtn
            variant="ghost"
            size="sm"
            routerLink="/profile"
            routerLinkActive="bg-muted text-foreground"
          >
            {{ messages.nav.profile }}
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-2">
        <!-- Mobile nav (simple links for now) -->
        <nav class="flex items-center gap-1 sm:hidden" [attr.aria-label]="messages.navLabel">
          <a
            hlmBtn
            variant="ghost"
            size="sm"
            routerLink="/"
            routerLinkActive="bg-muted"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ messages.nav.home }}
          </a>
          <a
            hlmBtn
            variant="ghost"
            size="sm"
            routerLink="/projects"
            routerLinkActive="bg-muted"
          >
            {{ messages.nav.projects }}
          </a>
        </nav>

        <button
          hlmBtn
          variant="outline"
          size="sm"
          type="button"
          [disabled]="isLoggingOut()"
          (click)="logout()"
        >
          {{ isLoggingOut() ? messages.loggingOut : messages.logout }}
        </button>
      </div>
    </div>
  </header>

  @if (needsEmailVerification()) {
    <div class="border-border bg-primary/5 border-b" role="status">
      <div
        class="mx-auto flex max-w-6xl flex-col gap-2 px-4 py-3 sm:flex-row sm:items-center sm:justify-between"
      >
        <div class="min-w-0">
          <p class="text-sm font-medium">{{ messages.verify.title }}</p>
          <p class="text-muted-foreground text-xs">{{ messages.verify.body }}</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button
            hlmBtn
            type="button"
            size="sm"
            [disabled]="resendSubmitting()"
            (click)="resendVerification()"
          >
            {{ resendSubmitting() ? messages.verify.resending : messages.verify.resend }}
          </button>
          <a hlmBtn variant="outline" size="sm" routerLink="/profile">
            {{ messages.verify.profile }}
          </a>
        </div>
      </div>
    </div>
  }

  <div class="flex-1">
    <router-outlet />
  </div>
</div>
