<div class="bg-background flex min-h-svh flex-col">
  <header class="border-border bg-card/80 sticky top-0 z-40 border-b backdrop-blur-md">
    <div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-4 px-4">
      <div class="flex items-center gap-6">
        <a
          routerLink="/"
          class="text-foreground text-sm font-semibold tracking-tight"
        >
          {{ messages.brand }}
        </a>
        <nav class="flex items-center gap-1" [attr.aria-label]="messages.navLabel">
          <a
            hlmBtn
            variant="ghost"
            size="sm"
            routerLink="/"
            routerLinkActive="bg-muted"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ messages.nav.home }}
          </a>
          <a
            hlmBtn
            variant="ghost"
            size="sm"
            routerLink="/projects"
            routerLinkActive="bg-muted"
          >
            {{ messages.nav.projects }}
          </a>
          <a
            hlmBtn
            variant="ghost"
            size="sm"
            routerLink="/profile"
            routerLinkActive="bg-muted"
          >
            {{ messages.nav.profile }}
          </a>
        </nav>
      </div>

      <button
        hlmBtn
        variant="outline"
        size="sm"
        type="button"
        [disabled]="isLoggingOut()"
        (click)="logout()"
      >
        {{ isLoggingOut() ? messages.loggingOut : messages.logout }}
      </button>
    </div>
  </header>

  @if (needsEmailVerification()) {
    <div
      class="border-border bg-muted/40 border-b"
      role="status"
    >
      <div
        class="mx-auto flex max-w-6xl flex-col gap-2 px-4 py-3 sm:flex-row sm:items-center sm:justify-between"
      >
        <div class="min-w-0">
          <p class="text-sm font-medium">{{ messages.verify.title }}</p>
          <p class="text-muted-foreground text-xs">{{ messages.verify.body }}</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button
            hlmBtn
            type="button"
            size="sm"
            [disabled]="resendSubmitting()"
            (click)="resendVerification()"
          >
            {{ resendSubmitting() ? messages.verify.resending : messages.verify.resend }}
          </button>
          <a hlmBtn variant="outline" size="sm" routerLink="/profile">
            {{ messages.verify.profile }}
          </a>
        </div>
      </div>
    </div>
  }

  <div class="flex-1">
    <router-outlet />
  </div>
</div>
