<main class="bg-background relative flex min-h-svh flex-col">
  <sl-auth-theme-toggle />

  <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <div
      class="bg-primary/10 absolute -top-32 left-1/2 size-[40rem] -translate-x-1/2 rounded-full blur-3xl"
    ></div>
  </div>

  <div class="relative mx-auto flex w-full max-w-md flex-1 flex-col justify-center px-4 py-10">
    <section class="border-border bg-card rounded-2xl border p-6 shadow-sm md:p-8">
      <header class="mb-6 flex flex-col items-center text-center">
        <img
          src="favicon.svg"
          alt=""
          width="36"
          height="36"
          class="mb-4 size-9 rounded-xl shadow-sm"
        />
        <h1 class="text-xl font-semibold tracking-tight">{{ messages.forgotPassword.title }}</h1>
        <p class="text-muted-foreground mt-1 text-sm">{{ messages.forgotPassword.description }}</p>
      </header>

      <form class="flex flex-col gap-4" (submit)="onSubmit($event)">
        @if (serverError(); as error) {
          <div
            class="border-destructive/40 bg-destructive/10 text-destructive rounded-lg border px-3 py-2 text-sm"
            role="alert"
          >
            {{ error }}
          </div>
        }
        @if (successMessage(); as success) {
          <div
            class="border-border bg-muted/40 text-foreground rounded-lg border px-3 py-2 text-sm"
            role="status"
          >
            {{ success }}
          </div>
        }

        <div hlmField>
          <label hlmFieldLabel for="forgot-email">{{ messages.forgotPassword.emailLabel }}</label>
          <input
            id="forgot-email"
            type="email"
            hlmInput
            autocomplete="email"
            [formField]="form.email"
            [attr.aria-invalid]="emailError() ? true : null"
            [placeholder]="messages.forgotPassword.emailPlaceholder"
          />
          @if (emailError(); as message) {
            <hlm-field-error forceShow>{{ message }}</hlm-field-error>
          }
        </div>

        <button
          hlmBtn
          type="submit"
          class="w-full"
          [disabled]="form().invalid() || isSubmitting()"
        >
          {{
            isSubmitting()
              ? messages.forgotPassword.submitting
              : messages.forgotPassword.submit
          }}
        </button>
      </form>

      <p class="mt-6 text-center">
        <a hlmBtn variant="link" routerLink="/login" class="h-auto p-0 text-sm">
          {{ messages.forgotPassword.backToLogin }}
        </a>
      </p>
    </section>
  </div>
</main>
