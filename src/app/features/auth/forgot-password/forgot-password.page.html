<main class="bg-background relative flex min-h-svh items-center justify-center p-4">
  <sl-auth-theme-toggle />

  <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <div
      class="bg-primary/10 absolute -top-32 left-1/2 size-[40rem] -translate-x-1/2 rounded-full blur-3xl"
    ></div>
    <div class="bg-primary/5 absolute -right-20 bottom-0 size-[28rem] rounded-full blur-3xl"></div>
  </div>

  <section hlmCard class="relative w-full max-w-md shadow-sm">
    <header hlmCardHeader class="items-center text-center">
      <div class="mb-2 flex flex-col items-center gap-3">
        <span
          class="bg-primary text-primary-foreground flex size-10 items-center justify-center rounded-xl shadow-sm"
          aria-hidden="true"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            class="size-5"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12.5L9.5 17L19 7" />
            <path d="M5 8h14" opacity="0.55" />
          </svg>
        </span>
        <p class="text-muted-foreground text-xs font-medium tracking-wide uppercase">
          {{ messages.brand }}
        </p>
      </div>
      <h1 hlmCardTitle>{{ messages.forgotPassword.title }}</h1>
      <p hlmCardDescription>{{ messages.forgotPassword.description }}</p>
    </header>

    <div hlmCardContent>
      <form class="flex flex-col gap-4" (submit)="onSubmit($event)">
        @if (serverError(); as error) {
          <div
            class="border-destructive/40 bg-destructive/10 text-destructive rounded-xl border px-3 py-2 text-sm"
            role="alert"
          >
            {{ error }}
          </div>
        }
        @if (successMessage(); as success) {
          <div
            class="border-border bg-muted/40 text-foreground rounded-xl border px-3 py-2 text-sm"
            role="status"
          >
            {{ success }}
          </div>
        }

        <div hlmField>
          <label hlmFieldLabel for="forgot-email">{{ messages.forgotPassword.emailLabel }}</label>
          <input
            id="forgot-email"
            type="email"
            hlmInput
            autocomplete="email"
            [formField]="form.email"
            [attr.aria-invalid]="emailError() ? true : null"
            [placeholder]="messages.forgotPassword.emailPlaceholder"
          />
          @if (emailError(); as message) {
            <hlm-field-error forceShow>{{ message }}</hlm-field-error>
          }
        </div>

        <button
          hlmBtn
          type="submit"
          class="w-full"
          [disabled]="form().invalid() || isSubmitting()"
        >
          {{
            isSubmitting()
              ? messages.forgotPassword.submitting
              : messages.forgotPassword.submit
          }}
        </button>
      </form>
    </div>

    <footer hlmCardFooter class="justify-center">
      <a hlmBtn variant="link" routerLink="/login" class="h-auto p-0">
        {{ messages.forgotPassword.backToLogin }}
      </a>
    </footer>
  </section>
</main>
