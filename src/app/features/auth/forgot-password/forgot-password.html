<sl-auth-layout>
  <section class="flex items-center justify-center p-6 md:p-12">
    <div class="w-full max-w-sm">
      <header class="mb-6 flex flex-col">
        <div class="mb-4 flex items-center gap-2.5 md:hidden">
          <sl-brand-mark size="sm" />
          <span class="text-sm font-semibold">{{ messages.brand }}</span>
        </div>
        <h1 class="text-3xl font-semibold">{{ messages.forgotPassword.title }}</h1>
        <p class="text-muted-foreground mt-1 text-sm">{{ messages.forgotPassword.description }}</p>
      </header>

      <form class="flex flex-col gap-4" (submit)="onSubmit($event)">
        @if (serverError(); as error) {
          <div class="sl-notice sl-notice-danger" role="alert">{{ error }}</div>
        }
        @if (successMessage(); as message) {
          <div class="sl-notice sl-notice-success" role="status">{{ message }}</div>
        }

        <div hlmField>
          <label hlmFieldLabel for="forgot-email">{{ messages.forgotPassword.emailLabel }}</label>
          <input
            id="forgot-email"
            type="email"
            hlmInput
            autocomplete="email"
            [formField]="form.email"
            [attr.aria-invalid]="emailError() ? true : null"
            [attr.aria-describedby]="emailError() ? 'forgot-email-error' : null"
            [placeholder]="messages.forgotPassword.emailPlaceholder"
          />
          @if (emailError(); as message) {
            <hlm-field-error id="forgot-email-error" forceShow>{{ message }}</hlm-field-error>
          }
        </div>

        <button hlmBtn size="lg" type="submit" class="mt-1 w-full" [disabled]="isSubmitting()">
          {{ isSubmitting() ? messages.forgotPassword.submitting : messages.forgotPassword.submit }}
        </button>
      </form>

      <p class="text-muted-foreground mt-6 text-center text-sm">
        <a hlmBtn variant="link" routerLink="/login" class="h-auto p-0 font-semibold">
          {{ messages.forgotPassword.backToLogin }}
        </a>
      </p>
    </div>
  </section>
</sl-auth-layout>
