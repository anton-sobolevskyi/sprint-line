services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: sprint-line:prod
    restart: unless-stopped
    expose:
      - '80'

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
