services:
  angular:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '4200:4200'
    volumes:
      # Live code changes
      - .:/app
      # Keep container's node_modules (don't overwrite with host ones)
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # helps file watching on macOS/Windows
