services:
  - type: web
    name: sprint-line
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/sprint-line/browser
    envVars:
      - key: HUSKY
        value: '0'
      - key: NODE_VERSION
        value: '24'
    routes:
      # Angular SPA — all client routes fall through to index.html
      - type: rewrite
        source: /*
        destination: /index.html
