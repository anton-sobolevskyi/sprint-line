services:
  # ---------- CI / pre-push (run once, exit) ----------
  test-ci:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - CI=true
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules
    command: npm run test:ci
    profiles: ['ci']

  # ---------- Development (watch mode) ----------
  test-dev:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - CI=false
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_INTERVAL=2000
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules
    command: npm run test
    stdin_open: true
    tty: true
    profiles: ['dev']

volumes:
  test_node_modules:
